<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">Funcionários – JPets</ui:define>
    <ui:define name="pageTitle">Cadastro de Funcionários</ui:define>

    <ui:define name="content">
        <h:form id="formFuncionario">
            <p:messages id="msgs" closable="true" globalOnly="true" />

            <p:panel id="panelForm" styleClass="jpets-panel jpets-form-panel">
                <f:facet name="header">
                    <div class="panel-heading">
                        <span class="panel-heading__title">
                            <i class="pi #{funcionarioBean.edicao ? 'pi-pencil' : 'pi-user-plus'}"
                                aria-hidden="true" />
                            #{funcionarioBean.edicao ? 'Editar Funcionário' : 'Novo Funcionário'}
                        </span>
                    </div>
                </f:facet>

                <div class="form-grid">
                    <div class="field">
                        <p:outputLabel for="nome" value="Nome completo" />
                        <p:inputText id="nome" value="#{funcionarioBean.funcionario.nome}" required="true"
                            requiredMessage="Nome é obrigatório." maxlength="120" placeholder="Ex.: Maria da Silva" />
                        <p:message for="nome" />
                    </div>

                    <div class="field">
                        <p:outputLabel for="cpf" value="CPF" />
                        <p:inputMask id="cpf" value="#{funcionarioBean.funcionario.cpf}" mask="999.999.999-99"
                            required="true" requiredMessage="CPF é obrigatório." placeholder="000.000.000-00" />
                        <p:message for="cpf" />
                    </div>

                    <div class="field">
                        <p:outputLabel for="email" value="E-mail" />
                        <p:inputText id="email" value="#{funcionarioBean.funcionario.email}" required="true"
                            requiredMessage="E-mail é obrigatório." validatorMessage="E-mail inválido." maxlength="150"
                            placeholder="usuario@jpets.com.br">
                            <f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$" />
                        </p:inputText>
                        <p:message for="email" />
                    </div>

                    <div class="field">
                        <p:outputLabel for="telefone" value="Telefone" />
                        <p:inputMask id="telefone" value="#{funcionarioBean.funcionario.telefone}"
                            mask="(99) 99999-9999" placeholder="(00) 00000-0000" />
                        <p:message for="telefone" />
                    </div>

                    <div class="field">
                        <p:outputLabel for="dataNasc" value="Data de Nascimento" />
                        <p:datePicker id="dataNasc" value="#{funcionarioBean.funcionario.dataNascimento}"
                            pattern="dd/MM/yyyy" showIcon="true" maxdate="#{funcionarioBean.hoje}"
                            placeholder="dd/mm/aaaa" />
                        <p:message for="dataNasc" />
                    </div>

                    <div class="field">
                        <p:outputLabel for="dataAdm" value="Data de Admissão" />
                        <p:datePicker id="dataAdm" value="#{funcionarioBean.funcionario.dataAdmissao}"
                            pattern="dd/MM/yyyy" showIcon="true" required="true"
                            requiredMessage="Data de admissão é obrigatória." placeholder="dd/mm/aaaa" />
                        <p:message for="dataAdm" />
                    </div>

                    <div class="field">
                        <p:outputLabel for="cargo" value="Cargo" />
                        <p:selectOneMenu id="cargo" value="#{funcionarioBean.funcionario.cargo}" required="true"
                            requiredMessage="Cargo é obrigatório.">
                            <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{funcionarioBean.cargos}" var="c" itemLabel="#{c.descricao}"
                                itemValue="#{c}" />
                        </p:selectOneMenu>
                        <p:message for="cargo" />
                    </div>

                    <div class="field">
                        <p:outputLabel for="salario" value="Salário (R$)" />
                        <p:inputNumber id="salario" value="#{funcionarioBean.funcionario.salario}" prefix="R$ "
                            decimalSeparator="," thousandSeparator="." minValue="0" maxValue="99999.99"
                            placeholder="0,00" />
                        <p:message for="salario" />
                    </div>

                    <div class="field field--switch">
                        <p:toggleSwitch id="ativo" value="#{funcionarioBean.funcionario.ativo}" />
                        <p:outputLabel for="ativo" value="Funcionário ativo" />
                    </div>
                </div>

                <div class="form-actions">
                    <p:commandButton id="btnSalvar" value="#{funcionarioBean.edicao ? 'Atualizar' : 'Cadastrar'}"
                        icon="pi pi-check" action="#{funcionarioBean.salvar}" update=":formFuncionario"
                        styleClass="jpets-button jpets-button--primary" />
                    <p:commandButton value="Cancelar" icon="pi pi-times" action="#{funcionarioBean.cancelar}"
                        update=":formFuncionario" immediate="true" styleClass="jpets-button jpets-button--secondary" />
                </div>
            </p:panel>

            <p:panel styleClass="jpets-panel jpets-list-panel">
                <f:facet name="header">
                    <div class="panel-heading">
                        <span class="panel-heading__title">
                            <i class="pi pi-list" aria-hidden="true" />
                            Funcionários Cadastrados
                        </span>
                        <p:commandButton value="Novo" icon="pi pi-plus" ariaLabel="Cadastrar novo funcionário"
                            action="#{funcionarioBean.novoFuncionario}" update=":formFuncionario" immediate="true"
                            styleClass="jpets-button jpets-button--ghost" />
                    </div>
                </f:facet>

                <div class="table-scroll">
                    <p:dataTable id="tabelaFuncionarios" value="#{funcionarioBean.funcionarios}" var="f"
                        selection="#{funcionarioBean.selecionado}" selectionMode="single" rowKey="#{f.id}"
                        paginator="true" paginatorPosition="bottom" rows="10" reflow="true"
                    paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                    rowsPerPageTemplate="5,10,20" currentPageReportTemplate="Exibindo {startRecord}–{endRecord} de {totalRecords}"
                    emptyMessage="Nenhum funcionário cadastrado." styleClass="p-datatable-striped p-datatable-sm jpets-table">

                    <p:column headerText="Nome" sortBy="#{f.nome}" filterBy="#{f.nome}" filterMatchMode="contains">
                        <h:outputText value="#{f.nome}" />
                    </p:column>
                    <p:column headerText="CPF" style="width:140px;">
                        <h:outputText value="#{f.cpf}" />
                    </p:column>
                    <p:column headerText="E-mail" sortBy="#{f.email}">
                        <h:outputText value="#{f.email}" />
                    </p:column>
                    <p:column headerText="Cargo" sortBy="#{f.cargo.descricao}" filterBy="#{f.cargo.descricao}"
                        filterMatchMode="contains" style="width:140px;">
                        <h:outputText value="#{f.cargo.descricao}" />
                    </p:column>
                    <p:column headerText="Admissão" sortBy="#{f.dataAdmissao}" style="width:120px;">
                        <h:outputText value="#{f.dataAdmissao}">
                            <f:convertDateTime pattern="dd/MM/yyyy" type="localDate" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Salário" sortBy="#{f.salario}" style="width:120px;">
                        <h:outputText value="#{f.salario}">
                            <f:convertNumber type="currency" currencySymbol="R$ " groupingUsed="true"
                                minFractionDigits="2" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Ativo" style="width:80px; text-align:center;">
                        <p:tag value="Ativo" severity="success" rendered="#{f.ativo}" />
                        <p:tag value="Inativo" severity="danger" rendered="#{!f.ativo}" />
                    </p:column>
                    <p:column headerText="Ações" style="width:110px; text-align:center;" exportable="false">
                        <div class="table-actions">
                            <p:commandButton icon="pi pi-pencil" title="Editar" ariaLabel="Editar funcionário"
                                styleClass="jpets-button jpets-icon-button jpets-icon-button--edit"
                                action="#{funcionarioBean.editar(f)}" process="@this" update=":formFuncionario" />
                            <p:commandButton icon="pi pi-trash" title="Excluir" ariaLabel="Excluir funcionário"
                                styleClass="jpets-button jpets-icon-button jpets-icon-button--delete"
                                action="#{funcionarioBean.setSelecionado(f)}" process="@this" update="@none"
                                oncomplete="PF('dlgConfirmar').show()" />
                        </div>
                    </p:column>
                </p:dataTable>
                </div>
            </p:panel>
        </h:form>

        <h:form id="formExcluirFuncionario">
            <p:confirmDialog id="dlgConfirmar" widgetVar="dlgConfirmar" header="Confirmar Exclusão"
                message="Deseja realmente excluir o funcionário selecionado? Esta ação não pode ser desfeita."
                severity="warn" closable="true">
                <p:commandButton value="Sim, excluir" icon="pi pi-trash" styleClass="jpets-button jpets-button--danger"
                    action="#{funcionarioBean.excluir}" update=":formFuncionario"
                    oncomplete="PF('dlgConfirmar').hide()" />
                <p:commandButton value="Cancelar" icon="pi pi-times" styleClass="jpets-button jpets-button--secondary"
                    onclick="PF('dlgConfirmar').hide(); return false;" immediate="true" />
            </p:confirmDialog>
        </h:form>
    </ui:define>

</ui:composition>

</html>
