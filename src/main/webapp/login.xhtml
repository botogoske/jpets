<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111c31" />
    <link rel="icon" type="image/svg+xml" href="#{request.contextPath}/favicon.svg" />
    <title>Login - JPets</title>
    <h:outputStylesheet library="css" name="jpets.css" />
</h:head>

<h:body styleClass="login-page">
    <main class="login-layout">
        <section class="login-brand-panel" aria-labelledby="login-brand-title">
            <div class="login-brand-lockup">
                <span class="brand-mark" aria-hidden="true">
                    <i class="pi pi-heart-fill" />
                </span>
                <span class="brand-copy">
                    <span class="brand-name">JPets</span>
                </span>
            </div>

            <div class="login-brand-copy">
                <h1 id="login-brand-title">JPets</h1>
                <p>Sistema de Gestão de Petshops</p>
                <ul class="login-module-list">
                    <li><i class="pi pi-check-circle" aria-hidden="true" /> Funcionários</li>
                    <li><i class="pi pi-check-circle" aria-hidden="true" /> Tutores</li>
                    <li><i class="pi pi-check-circle" aria-hidden="true" /> Pets</li>
                </ul>
            </div>
        </section>

        <section class="login-form-stage" aria-labelledby="login-title">
            <div class="login-card">
                <div class="login-heading">
                    <span class="login-heading__icon" aria-hidden="true">
                        <i class="pi pi-lock" />
                    </span>
                    <div>
                        <h2 id="login-title">Acesso ao Sistema</h2>
                        <p>Use suas credenciais para entrar.</p>
                    </div>
                </div>

                <h:form id="loginForm" styleClass="login-form">
                    <p:messages id="loginMessages" closable="true" globalOnly="true" />

                    <div class="login-field">
                        <p:outputLabel for="usuario" value="Usuário" />
                        <p:inputText id="usuario" value="#{loginBean.usuario}" required="true"
                            requiredMessage="Informe o usuário." autocomplete="username" />
                        <p:message for="usuario" />
                    </div>

                    <div class="login-field">
                        <p:outputLabel for="senha" value="Senha" />
                        <p:password id="senha" value="#{loginBean.senha}" required="true"
                            requiredMessage="Informe a senha." autocomplete="current-password" feedback="false" />
                        <p:message for="senha" />
                    </div>

                    <p:commandButton value="Entrar" icon="pi pi-sign-in" action="#{loginBean.performLogin}"
                        update="@form" styleClass="jpets-button jpets-button--primary login-submit" />
                </h:form>
            </div>
        </section>
    </main>
</h:body>

</html>
