<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<h:head>
    <title>Login - jpets</title>
    <meta charset="UTF-8"/>
</h:head>

<h:body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#f4f6f8; margin:0;">

    <p:panel header="Acesso ao Sistema" style="width:380px;">
        <p:messages closable="true" globalOnly="true"/>

        <h:form>
            <p:panelGrid columns="2" style="width:100%;">
                <p:outputLabel for="usuario" value="Usuário:"/>
                <p:inputText id="usuario" value="#{loginBean.usuario}" required="true"
                             requiredMessage="Informe o usuário" style="width:100%;"/>

                <p:outputLabel for="senha" value="Senha:"/>
                <p:password id="senha" value="#{loginBean.senha}" required="true"
                            requiredMessage="Informe a senha" feedback="false" style="width:100%;"/>
            </p:panelGrid>

            <p:commandButton value="Entrar" action="#{loginBean.performLogin}" update="@form"
                             style="margin-top:1rem; width:100%;"/>
        </h:form>

    </p:panel>

</h:body>
</html>
