<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111c31" />
    <link rel="icon" type="image/svg+xml" href="#{request.contextPath}/favicon.svg" />
    <title>
        <ui:insert name="title">JPets</ui:insert>
    </title>
    <h:outputStylesheet library="css" name="jpets.css" />
</h:head>

<h:body styleClass="app-body"
    onload="var activeLink = document.querySelector('.sidebar-nav a.active'); if (activeLink) { activeLink.scrollIntoView({ block: 'nearest', inline: 'center' }); }">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <div class="app-shell">
        <aside class="app-sidebar" aria-label="Navegação lateral">
            <h:link outcome="/home" styleClass="sidebar-brand">
                <span class="brand-mark" aria-hidden="true">
                    <i class="pi pi-heart-fill" />
                </span>
                <span class="brand-copy">
                    <span class="brand-name">JPets</span>
                    <span class="brand-caption">Sistema de Gestão de Petshops</span>
                </span>
            </h:link>

            <nav class="sidebar-nav" aria-label="Navegação principal">
                <div class="nav-section">Principal</div>
                <div class="nav-item">
                    <h:link outcome="/home" styleClass="#{request.servletPath == '/home.xhtml' ? 'active' : ''}">
                        <i class="pi pi-home" aria-hidden="true" />
                        <span>Home</span>
                        <h:outputText value=" Página atual" styleClass="sr-only"
                            rendered="#{request.servletPath == '/home.xhtml'}" />
                    </h:link>
                </div>

                <div class="nav-section">Cadastros</div>
                <div class="nav-item">
                    <h:link outcome="/funcionario" styleClass="#{request.servletPath == '/funcionario.xhtml' ? 'active' : ''}">
                        <i class="pi pi-id-card" aria-hidden="true" />
                        <span>Funcionários</span>
                        <h:outputText value=" Página atual" styleClass="sr-only"
                            rendered="#{request.servletPath == '/funcionario.xhtml'}" />
                    </h:link>
                </div>
                <div class="nav-item">
                    <h:link outcome="/tutor" styleClass="#{request.servletPath == '/tutor.xhtml' ? 'active' : ''}">
                        <i class="pi pi-users" aria-hidden="true" />
                        <span>Tutores</span>
                        <h:outputText value=" Página atual" styleClass="sr-only"
                            rendered="#{request.servletPath == '/tutor.xhtml'}" />
                    </h:link>
                </div>
                <div class="nav-item">
                    <h:link outcome="/pet" styleClass="#{request.servletPath == '/pet.xhtml' ? 'active' : ''}">
                        <i class="pi pi-heart" aria-hidden="true" />
                        <span>Pets</span>
                        <h:outputText value=" Página atual" styleClass="sr-only"
                            rendered="#{request.servletPath == '/pet.xhtml'}" />
                    </h:link>
                </div>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <h1 class="topbar-title">
                    <ui:insert name="pageTitle">JPets</ui:insert>
                </h1>
                <div class="topbar-actions">
                    <h:form id="logoutForm">
                        <p:commandButton value="Sair" icon="pi pi-sign-out" ariaLabel="Sair da conta"
                            action="/login?faces-redirect=true" styleClass="jpets-button jpets-button--ghost jpets-button--sm" />
                    </h:form>
                </div>
            </header>

            <main id="conteudo" class="page-content" tabindex="-1">
                <ui:insert name="content" />
            </main>
        </div>
    </div>
</h:body>

</html>
